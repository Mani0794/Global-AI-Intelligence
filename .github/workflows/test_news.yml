name: Global AI Intelligence

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  run-ai-intelligence:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate and Send AI Intelligence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python -u news_engine.py

      - name: Save HTML Email
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-email-${{ github.run_number }}
          path: ai_news_email.html
          if-no-files-found: ignore

      - name: Save sent news history
        run: |
          if [ -f sent_news.json ]; then

            git config user.name "Global AI Intelligence Bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add sent_news.json

            if git diff --cached --quiet; then
              echo "No new sent-news history to save."
            else
              git commit -m "Update AI news sent history [skip ci]"
              git push
            fi

          else
            echo "sent_news.json does not exist. Nothing to save."
          fi
